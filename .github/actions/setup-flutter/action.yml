name: Set up Flutter
description: >
  Installs the Flutter SDK pinned in the Dockerfile (FLUTTER_VERSION and
  FLUTTER_SHA256) from Flutter's own release bucket, verified by checksum the
  same way the Dockerfile installs it, and restores the SDK and pub caches. The
  Dockerfile is the one place CI reads the version from; tools/check-versions.sh
  keeps flake.nix in step with it. No community action in the chain.

runs:
  using: composite
  steps:
    - name: Read the Flutter pin from the Dockerfile
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        version="$(sed -n 's/^ARG FLUTTER_VERSION=//p' Dockerfile)"
        sha256="$(sed -n 's/^ARG FLUTTER_SHA256=//p' Dockerfile)"
        [[ -n "$version" && -n "$sha256" ]] || { echo "::error::FLUTTER_VERSION or FLUTTER_SHA256 missing from the Dockerfile"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

    - name: Cache the Flutter SDK
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/flutter
        key: flutter-${{ runner.os }}-${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.sha256 }}

    - name: Cache the pub packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock', 'app/packages/*/pubspec.lock') }}
        restore-keys: pub-${{ runner.os }}-

    - name: Install Flutter
      shell: bash
      env:
        FLUTTER_VERSION: ${{ steps.pin.outputs.version }}
        FLUTTER_SHA256: ${{ steps.pin.outputs.sha256 }}
      run: |
        set -euo pipefail
        if [ ! -x "$HOME/flutter/bin/flutter" ]; then
          archive="$RUNNER_TEMP/flutter.tar.xz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_SHA256}  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$HOME"
          rm "$archive"
        fi
        echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
        echo "FLUTTER_ROOT=$HOME/flutter" >> "$GITHUB_ENV"
        echo "FLUTTER_SUPPRESS_ANALYTICS=true" >> "$GITHUB_ENV"
