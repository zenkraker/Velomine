name: Demo image

# Tests, then builds the server image that runs the public demo and pushes it
# to the Scaleway registry. Nothing is pushed unless every test is green. The
# demo host pulls the image on a timer and rolls back if it does not come up,
# so a release needs no inbound SSH anywhere.

on:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - Directory.Build.props
      - Directory.Packages.props
      - Velomine.slnx
      - src/**
      - tests/**
      - app/**
      - .github/workflows/demo-image.yml
  workflow_dispatch:

concurrency:
  group: demo-image
  cancel-in-progress: true

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

env:
  REGISTRY: rg.nl-ams.scw.cloud
  IMAGE: rg.nl-ams.scw.cloud/velomine-demo/app
  FLUTTER_VERSION: "3.47.9"
  FLUTTER_SHA256: "25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a"

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Velomine.slnx --locked-mode

      - name: Test
        run: dotnet test --solution Velomine.slnx --no-restore --logger "console;verbosity=normal"

  web-tests:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the Flutter SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/flutter
          key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      # The SDK comes from Flutter's own release bucket, pinned by checksum, the
      # same way the Dockerfile installs it. No community action in the chain.
      - name: Install Flutter
        run: |
          if [ ! -x "$HOME/flutter/bin/flutter" ]; then
            curl -fsSL -o /tmp/flutter.tar.xz \
              "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
            echo "${FLUTTER_SHA256}  /tmp/flutter.tar.xz" | sha256sum -c -
            tar -xJf /tmp/flutter.tar.xz -C "$HOME"
          fi
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$HOME/flutter" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate
        run: dart run build_runner build

      - name: Format
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  image:
    name: Build and push image
    needs: [server-tests, web-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only the repository's default branch publishes the demo image, whatever
    # it is called; a manual run publishes from the branch it was started on.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SCW_REGISTRY_ACCESS_KEY }}
          password: ${{ secrets.SCW_REGISTRY_SECRET_KEY }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=demo
            REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:demo
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
