name: Release

# Builds the server and web images together, once per commit, smoke-tests them as a pair and pushes them to GHCR as
# a release, then tags the commit and writes a GitHub Release with generated notes:
#
#   push to main  ->  the next patch version after the highest vX.Y.Z tag (v0.2.0 -> v0.2.1)
#   tag vX.Y.Z    ->  that version; push one by hand for a minor or major release, and main counts on from it
#
# Each version publishes ghcr.io/zenkraker/velomine-{server,web}:X.Y.Z, :X.Y and :sha-<commit>. Tags and OCI labels
# come from docker/metadata-action, and both images always get the same ones. Nothing is pushed or tagged unless CI and
# the smoke test pass, and `latest` is never published. A commit that already carries a version tag is not released
# again from main. Deploying is manual and GitHub has no access to the hosts: the operator sets the version on the
# host and runs docker compose.

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# A release in progress is never cancelled half-way; a newer push to main waits, and if several pile up only the
# newest one runs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # Only the Android job reads one: the APK signing key.
    secrets: inherit

  # Only the "add one" is ours: the tags come from the GitHub CLI, and the release itself from gh release create.
  version:
    name: Pick the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - name: Next version
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "tag=$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"
            echo "publish=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          refs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[] | select(.ref | test("^refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+$")) | "\(.ref | ltrimstr("refs/tags/")) \(.object.sha)"')"
          if grep -q " $GITHUB_SHA\$" <<<"$refs"; then
            echo "This commit is already a release; its tag's run publishes it."
            echo "publish=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(cut -d' ' -f1 <<<"$refs" | sort -V | tail -n1)"
          IFS=. read -r major minor patch <<<"${latest:-v0.0.0}"
          echo "tag=$major.$minor.$((patch + 1))" >>"$GITHUB_OUTPUT"
          echo "publish=true" >>"$GITHUB_OUTPUT"

  # Builds and smoke-tests the pair while CI runs, so a release waits for the longer of the two, not their sum. Nothing
  # leaves this job: the publish job pushes only once CI has passed too.
  images:
    name: Build and smoke-test the images
    needs: [version]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      server-tags: ${{ steps.meta-server.outputs.tags }}
      server-labels: ${{ steps.meta-server.outputs.labels }}
      server-version: ${{ steps.meta-server.outputs.version }}
      web-tags: ${{ steps.meta-web.outputs.tags }}
      web-labels: ${{ steps.meta-web.outputs.labels }}
      web-version: ${{ steps.meta-web.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version from the job above; it is also the version the images report (the highest-priority tag).
      - name: Server tags and labels
        id: meta-server
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/zenkraker/velomine-server
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Velomine server
            org.opencontainers.image.description=Velomine API and background work

      - name: Web tags and labels
        id: meta-web
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/zenkraker/velomine-web
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Velomine web
            org.opencontainers.image.description=Velomine web app and presentation site

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build and load both images locally first: nothing reaches the registry before the pair passes the smoke test.
      - name: Build the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          tags: velomine-server:smoke
          labels: ${{ steps.meta-server.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta-server.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          tags: velomine-web:smoke
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta-web.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Smoke test
        run: tools/smoke-test-image.sh velomine-server:smoke velomine-web:smoke "+${GITHUB_SHA::7}"

  # Pushes the tested pair once CI has passed as well.
  publish:
    name: Push the images
    needs: [ci, version, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every layer comes from the cache the images job wrote, so these push the images that were just tested, with an
      # SBOM and build provenance attached.
      - name: Push the server image
        id: push-server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ needs.images.outputs.server-tags }}
          labels: ${{ needs.images.outputs.server-labels }}
          build-args: |
            VERSION=${{ needs.images.outputs.server-version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=server

      - name: Push the web image
        id: push-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ needs.images.outputs.web-tags }}
          labels: ${{ needs.images.outputs.web-labels }}
          build-args: |
            VERSION=${{ needs.images.outputs.web-version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=web

      - name: Attest the server image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/zenkraker/velomine-server
          subject-digest: ${{ steps.push-server.outputs.digest }}
          push-to-registry: true

      - name: Attest the web image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/zenkraker/velomine-web
          subject-digest: ${{ steps.push-web.outputs.digest }}
          push-to-registry: true

  # Tagging with the workflow's token starts no new run, so the tag never builds the images a second time.
  release:
    name: Tag the commit and write the GitHub Release
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
