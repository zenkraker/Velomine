name: Release

# Builds the server and web images together, once per commit, smoke-tests them as a pair and pushes them to GHCR:
#
#   push to main  ->  ghcr.io/zenkraker/velomine-{server,web}:0.0.0-main.<run> and :sha-<commit>
#   tag vX.Y.Z    ->  :X.Y.Z, :X.Y and :sha-<commit>
#
# Tags and OCI labels come from docker/metadata-action, and both images always get the same ones. Nothing is pushed
# unless CI and the smoke test pass, and `latest` is never published. Deploying is manual and GitHub has no access to the
# hosts: the operator sets the version on the host and runs docker compose (deploy/host/README.md, "Releasing").

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# A release in progress is never cancelled half-way; a newer push to main waits, and if several pile up only the
# newest one runs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  images:
    name: Build, smoke-test and push the images
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag vX.Y.Z is version X.Y.Z; a build from main is a prerelease of 0.0.0 numbered by the run, so the two can
      # never be confused. The version is the highest-priority tag (semver, then the main build, then the commit).
      - name: Server tags and labels
        id: meta-server
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/zenkraker/velomine-server
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=0.0.0-main.${{ github.run_number }},enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Velomine server
            org.opencontainers.image.description=Velomine API and background work

      - name: Web tags and labels
        id: meta-web
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/zenkraker/velomine-web
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=0.0.0-main.${{ github.run_number }},enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Velomine web
            org.opencontainers.image.description=Velomine web app and presentation site

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build and load both images locally first: nothing reaches the registry before the pair passes the smoke test.
      - name: Build the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          tags: velomine-server:smoke
          labels: ${{ steps.meta-server.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta-server.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          tags: velomine-web:smoke
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta-web.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Smoke test
        run: tools/smoke-test-image.sh velomine-server:smoke velomine-web:smoke "+${GITHUB_SHA::7}"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every layer comes from the cache of the builds above, so these push the images that were just tested, with an
      # SBOM and build provenance attached.
      - name: Push the server image
        id: push-server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta-server.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=server

      - name: Push the web image
        id: push-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta-web.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=web

      - name: Attest the server image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/zenkraker/velomine-server
          subject-digest: ${{ steps.push-server.outputs.digest }}
          push-to-registry: true

      - name: Attest the web image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/zenkraker/velomine-web
          subject-digest: ${{ steps.push-web.outputs.digest }}
          push-to-registry: true
