name: Release

# Builds the server and web images together, once per commit, and moves them through the environments:
#
#   push to main  ->  CI -> images ghcr.io/zenkraker/velomine-{server,web}:sha-<commit>
#   tag vX.Y.Z    ->  CI -> images :X.Y.Z (and X.Y) -> demo (after an approval)
#
# The two images always share one version and move together. A deploy moves each environment's pointer tag to the
# digests it was given; it never rebuilds. Nothing is pushed unless CI and the smoke test pass. No secret is stored for
# this: GHCR takes the workflow's own token. Hosts pull their pointer tags and roll back on their own
# (deploy/host/update.sh); the deploy job waits until the environment reports the new commit.
#
# Only the demo runs until there are customers (docs/architecture.md). dev, staging and prod are written out below,
# commented out: to turn one on, uncomment its job, and check it, since commented code is not linted.

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# A release in progress is never cancelled half-way; a newer push to main waits, and if several pile up only the
# newest one runs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVER_IMAGE: ghcr.io/zenkraker/velomine-server
  WEB_IMAGE: ghcr.io/zenkraker/velomine-web

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  images:
    name: Build, smoke-test and push the images
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      server-digest: ${{ steps.push-server.outputs.digest }}
      web-digest: ${{ steps.push-web.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag vX.Y.Z is version X.Y.Z; a build from main is a prerelease of 0.0.0 numbered by the run, so the two can
      # never be confused. Both images get the same tags.
      - name: Version and tags
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            suffixes=("${version}" "${version%.*}")
          else
            version="0.0.0-main.${GITHUB_RUN_NUMBER}"
            suffixes=("sha-${GITHUB_SHA}")
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          for name in server web; do
            image_var="${name^^}_IMAGE"
            {
              echo "${name}-tags<<EOF"
              for suffix in "${suffixes[@]}"; do echo "${!image_var}:${suffix}"; done
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: velomine-server:smoke
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: velomine-web:smoke
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Smoke test
        run: tools/smoke-test-image.sh velomine-server:smoke velomine-web:smoke "+${GITHUB_SHA::7}"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every layer comes from the cache of the builds above, so these push the images that were just tested, with an
      # SBOM and build provenance attached.
      - name: Push the server image
        id: push-server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.version.outputs.server-tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=server

      - name: Push the web image
        id: push-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.version.outputs.web-tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=web

      - name: Attest the server image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.SERVER_IMAGE }}
          subject-digest: ${{ steps.push-server.outputs.digest }}
          push-to-registry: true

      - name: Attest the web image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.push-web.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SERVER_DIGEST: ${{ steps.push-server.outputs.digest }}
          WEB_DIGEST: ${{ steps.push-web.outputs.digest }}
          SERVER_TAGS: ${{ steps.version.outputs.server-tags }}
          WEB_TAGS: ${{ steps.version.outputs.web-tags }}
        run: |
          tick='`'
          {
            echo "### Images ${VERSION}"
            echo
            echo "- ${tick}${SERVER_IMAGE}@${SERVER_DIGEST}${tick}"
            echo "- ${tick}${WEB_IMAGE}@${WEB_DIGEST}${tick}"
            echo
            echo "Tags:"
            while read -r tag; do echo "- ${tick}${tag}${tick}"; done <<< "${SERVER_TAGS}"$'\n'"${WEB_TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"

  # The demo environment requires a reviewer (Settings -> Environments), so a release waits here until someone
  # approves it.
  demo:
    name: Demo
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: demo
      server-digest: ${{ needs.images.outputs.server-digest }}
      web-digest: ${{ needs.images.outputs.web-digest }}
      revision: ${{ github.sha }}

  # Off until there are customers. To turn on: uncomment, add the environment to deploy.yml's choices, and install it on
  # the host (deploy/host/README.md). When prod is on, move the demo after it (needs: [images, prod]).
