name: CI

# The checks every change must pass: the same ones as `just check`, plus the
# ones a laptop forgets (generated files committed, API client in step with the
# server, Flutter pinned the same everywhere). Runs on every pull request, and
# release.yml calls it before it builds an image, so nothing is published
# without it. Nothing here holds a secret, so it is safe for pull requests from
# forks.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# A newer push to a pull request supersedes the older run. When release.yml
# calls this workflow the group is the run id, so a call never cancels itself
# or its caller.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  versions:
    name: Pinned versions agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/check-versions.sh

  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Restore
        run: dotnet restore Velomine.slnx --locked-mode

      - name: Format
        run: dotnet format Velomine.slnx --verify-no-changes --no-restore

      # The test platform cannot redraw its progress bar in CI and stays silent
      # until the end; detailed output prints each test as it finishes.
      # Testcontainers starts postgres:17 on the runner's Docker.
      - name: Test
        run: >-
          dotnet test --solution Velomine.slnx --no-restore
          --output Detailed --progress off
          --results-directory "$RUNNER_TEMP/test-results"
          --report-xunit-markdown --report-xunit-markdown-filename server-tests.md

      - name: Publish the test summary
        if: ${{ !cancelled() }}
        run: |
          shopt -s globstar nullglob
          for report in "$RUNNER_TEMP"/test-results/**/server-tests.md; do
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done

  app:
    name: App (Dart)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Generated .g.dart and localisation files are committed (AGENTS.md), so
      # regenerating must change nothing.
      - name: Generate
        run: dart run build_runner build

      - name: Generated files are committed
        run: |
          if [ -n "$(git status --porcelain .)" ]; then
            git status --porcelain .
            git --no-pager diff --stat .
            echo "::error::Generated files are out of date. Run 'just codegen' and commit the result."
            exit 1
          fi

      - name: Format
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # `flutter test` never compiles the Kotlin side. The FIT encoder and the recorder models are tested here, in a job
  # of their own so they run beside the Dart checks instead of after them.
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The JDK the dev shell uses (flake.nix), not whichever one the runner image ships.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        id: flutter
        uses: ./.github/actions/setup-flutter

      # The Gradle distribution, the Android build dependencies and the build cache (org.gradle.caching): without them
      # every run downloads Gradle, resolves every dependency and compiles Flutter's Gradle plugin again. The key
      # changes with any version that decides what Gradle downloads; an older cache still seeds the run.
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-flutter-${{ steps.flutter.outputs.version }}-${{ hashFiles('app/android/**/*.gradle.kts', 'app/android/gradle.properties', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-flutter-${{ steps.flutter.outputs.version }}-

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Flutter's Android .gitignore leaves out gradlew and local.properties; --config-only writes them without a build.
      # The Kotlin tests do not need the Dart code, so its debug compile is skipped.
      - name: Android unit tests
        run: |
          flutter build apk --config-only
          cd android && ./gradlew :app:testDebugUnitTest -x compileFlutterBuildDebug --no-daemon

      # An installable APK for trying the app on a phone, downloadable from the run's summary page. The member enters
      # the server address on first start.
      # shortcut: signed with the runner's throwaway debug key, so a newer APK only installs after removing the older
      # one; give the release build its own key (a repository secret) when the app is distributed.
      - name: Build the APK
        run: flutter build apk --release

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: velomine-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  # Catches web-only compile errors minutes before the image build would. The image compiles the web app again from
  # source, so `docker compose up --build` keeps working without CI. A release builds that image right after CI, so
  # this job runs for pull requests and by hand only.
  web:
    name: Web
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build web
        run: flutter build web --release --no-web-resources-cdn

  api-client:
    name: API client matches the server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      # Dart runs tools/patch_api_client.dart after generation.
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Regenerate the client
        run: tools/generate-api-client.sh

      - name: The committed client is current
        run: |
          if [ -n "$(git status --porcelain app/packages/velomine_api)" ]; then
            git status --porcelain app/packages/velomine_api
            echo "::error::app/packages/velomine_api differs from the server's OpenAPI document. Run tools/generate-api-client.sh and commit the result."
            exit 1
          fi
