name: Deploy

# Points one environment at a server and web image pair that CI already built and tested, then waits until that
# environment reports the pair's commit: the server through GET /api/v1/server, the web image through /version.json.
#
# The host does the rest: deploy/host/update.sh (a systemd timer, every minute) pulls
# ghcr.io/zenkraker/velomine-{server,web}:<environment>, restarts the environment, and rolls back to the previous pair
# if it does not answer /health. So this job needs no SSH key or host secret, and a rolled-back release shows here as a
# failed deployment.
#
# Run it by hand to redeploy or roll back: pick the environment and a release tag (vX.Y.Z).
#
# Each GitHub environment holds the variable PUBLIC_URL (for example https://demo.velomine.eu); demo and prod require a
# reviewer. Only the demo runs until there are customers: add dev, staging and prod to the choices below when they are
# turned on (dev may then also take a commit SHA built from main).

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      server-digest:
        type: string
        required: true
      web-digest:
        type: string
        required: true
      revision:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [demo]
        required: true
      ref:
        description: Release tag (v1.2.3)
        type: string
        required: true

permissions:
  contents: read

env:
  SERVER_IMAGE: ghcr.io/zenkraker/velomine-server
  WEB_IMAGE: ghcr.io/zenkraker/velomine-web
  # How long to wait for the host: its timer runs every minute and its health gate may wait two minutes, twice, before
  # it rolls back.
  WAIT_SECONDS: "900"

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    # One deployment per environment at a time, never cancelled half-way.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the images
        id: images
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SERVER_DIGEST: ${{ inputs.server-digest }}
          WEB_DIGEST: ${{ inputs.web-digest }}
          REVISION: ${{ inputs.revision }}
          REF: ${{ inputs.ref }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PUBLIC_URL" == https://* ]] || { echo "::error::Set the PUBLIC_URL variable on the '$ENVIRONMENT' environment."; exit 1; }

          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty'; }

          if [[ -z "$SERVER_DIGEST" ]]; then
            # Manual run: only release images, built by the Release workflow from a tag.
            [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$REF' is not a release tag vX.Y.Z."; exit 1; }
            SERVER_DIGEST="$(digest_of "${SERVER_IMAGE}:${REF#v}")"
            WEB_DIGEST="$(digest_of "${WEB_IMAGE}:${REF#v}")"
            [[ "$SERVER_DIGEST" == sha256:* && "$WEB_DIGEST" == sha256:* ]] \
              || { echo "::error::No images for $REF. Was it built by the Release workflow?"; exit 1; }
            REVISION="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF}" --jq .sha)"
          fi

          {
            echo "server-digest=$SERVER_DIGEST"
            echo "web-digest=$WEB_DIGEST"
            echo "revision=$REVISION"
            echo "previous-server=$(digest_of "${SERVER_IMAGE}:${ENVIRONMENT}" || true)"
            echo "previous-web=$(digest_of "${WEB_IMAGE}:${ENVIRONMENT}" || true)"
          } >> "$GITHUB_OUTPUT"

      - name: Point ${{ inputs.environment }} at the images
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SERVER_DIGEST: ${{ steps.images.outputs.server-digest }}
          WEB_DIGEST: ${{ steps.images.outputs.web-digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${SERVER_IMAGE}:${ENVIRONMENT}" "${SERVER_IMAGE}@${SERVER_DIGEST}"
          docker buildx imagetools create --tag "${WEB_IMAGE}:${ENVIRONMENT}" "${WEB_IMAGE}@${WEB_DIGEST}"

      - name: Wait for ${{ inputs.environment }} to run them
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          REVISION: ${{ steps.images.outputs.revision }}
        run: |
          set -euo pipefail
          base="${PUBLIC_URL%/}"
          deadline=$(( $(date +%s) + WAIT_SECONDS ))
          server="" web=""
          while (( $(date +%s) < deadline )); do
            server="$(curl -fsS --max-time 10 "$base/api/v1/server" 2>/dev/null | jq -r '.version // empty' || true)"
            web="$(curl -fsS --max-time 10 "$base/version.json" 2>/dev/null | jq -r '.revision // empty' || true)"
            if [[ "$server" == *"+${REVISION::7}" && "$web" == "$REVISION" ]]; then
              echo "Running server ${server}, web ${web::7}."
              exit 0
            fi
            sleep 15
          done
          echo "::error::After ${WAIT_SECONDS}s ${PUBLIC_URL} runs server '${server:-no answer}' and web '${web:-no answer}', not ${REVISION::7}. The host may have rolled back: journalctl -u velomine-update@${ENVIRONMENT} on the host."
          exit 1

      - name: Summary
        if: ${{ always() }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REVISION: ${{ steps.images.outputs.revision }}
          SERVER_DIGEST: ${{ steps.images.outputs.server-digest }}
          WEB_DIGEST: ${{ steps.images.outputs.web-digest }}
          PREVIOUS_SERVER: ${{ steps.images.outputs.previous-server }}
          PREVIOUS_WEB: ${{ steps.images.outputs.previous-web }}
        run: |
          tick='`'
          {
            echo "### ${ENVIRONMENT}"
            echo
            echo "| | Server | Web |"
            echo "|---|---|---|"
            echo "| Now | ${tick}${SERVER_DIGEST}${tick} | ${tick}${WEB_DIGEST}${tick} |"
            echo "| Before | ${tick}${PREVIOUS_SERVER:-none}${tick} | ${tick}${PREVIOUS_WEB:-none}${tick} |"
            echo
            echo "Commit ${tick}${REVISION}${tick}. Roll back: run **Deploy** with environment ${tick}${ENVIRONMENT}${tick} and the previous release tag."
          } >> "$GITHUB_STEP_SUMMARY"
