# Keeps pinned versions current. Dependabot rewrites the pin (SHA or digest) and
# its version comment together; each update is still reviewed as a PR, and CI
# runs on it.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The base images of both Dockerfiles (server, and the web image's nginx) are
  # pinned by digest, so without this they would never get security patches.
  - package-ecosystem: docker
    directories:
      - /
      - /app
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]

  # The images the compose files run besides our own: PostgreSQL, Dex and the demo's Traefik.
  - package-ecosystem: docker-compose
    directories:
      - /
    schedule:
      interval: weekly
