# The web image's only configuration. It serves the presentation site (/srv/site) and the Flutter web app (/srv/app),
# and forwards the API to the server, so the browser sees one address and the cookie and single sign-on need no
# cross-origin setup. The server is reached as `server:8080` on the compose network.
# Forwarded to the server: /api, /health, /openapi, and /signin-oidc and /signout-callback-oidc for single sign-on.
#
# Runs as the unprivileged nginx user on a read-only root: everything nginx writes goes to /tmp (a tmpfs).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types {
        application/wasm wasm;
    }

    # No access log: it would hold addresses and raw paths (AGENTS.md, "Security and privacy in code").
    access_log off;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm text/plain;

    # Ride files are uploaded through here.
    client_max_body_size 30m;

    # Docker's DNS, so the server's address is looked up per request and nginx starts before the server does.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The client's address: trusted from a proxy on a private network in front (Traefik on the hosts), and taken from
    # the connection otherwise (a self-hoster exposing this port), so a client cannot spoof it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    server {
        listen 8080;
        absolute_redirect off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

        # The API, health, the OpenAPI document and the single sign-on callbacks (the OpenID Connect handler's default
        # paths, registered with the identity provider) belong to the server. One hop: the server sees the client's
        # address, scheme and host with its port, not ours.
        location ~ ^/(api|health|openapi|signin-oidc|signout-callback-oidc)(/|$) {
            set $server http://server:8080;
            proxy_pass $server;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 120s;
        }

        # The presentation site: plain HTML, served before the app. Its pages are linked with a trailing slash.
        location = / {
            root /srv/site;
            try_files /index.html =404;
            add_header Cache-Control "no-cache";
        }
        location ~ ^/(status|pricing|demo|contact|principles|privacy|terms|security)$ {
            return 301 $uri/;
        }
        location ~ ^/(status|pricing|demo|contact|principles|privacy|terms|security)/ {
            root /srv/site;
            try_files $uri $uri/index.html =404;
            add_header Cache-Control "no-cache";
        }
        location ^~ /static/ {
            root /srv/site;
        }
        location ^~ /.well-known/ {
            root /srv/site;
        }
        location = /robots.txt {
            root /srv/site;
        }

        # The web app. Flutter does not hash its file names, so every file is revalidated (ETag) instead of cached.
        location / {
            root /srv/app;
            try_files $uri @app;
            add_header Cache-Control "no-cache";
        }

        # A path without a file extension is a page of the app (it routes itself, e.g. /rides); a missing file is 404.
        location @app {
            root /srv/app;
            if ($uri ~ "\.[^/]*$") {
                return 404;
            }
            add_header Cache-Control "no-cache";
            rewrite ^ /index.html break;
        }
    }
}
