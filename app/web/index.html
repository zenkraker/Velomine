<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Velomine — cycling training for clubs and teams, self-hosted or cloud.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0F4C4A" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F0C" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Velomine">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Velomine</title>
  <link rel="manifest" href="manifest.json">

  <!-- The brand shows while the engine and the app download; flutter_bootstrap.js removes it after the first frame. -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #f0eee9;
    }

    #splash .mark-dot {
      animation: splash-pulse 1.6s ease-in-out infinite;
    }

    @keyframes splash-pulse {
      50% {
        opacity: 0.35;
      }
    }

    @media (prefers-color-scheme: dark) {
      #splash {
        background: #0e0f0c;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash .mark-dot {
        animation: none;
      }
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 120 120" width="96" height="96">
      <path d="M18 26 L60 96 L102 26" fill="none" stroke="#0F4C4A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M38 26 L60 60 L82 26" fill="none" stroke="#2E7D78" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="mark-dot" cx="60" cy="35" r="8" fill="#B24A22"/>
    </svg>
  </div>
  <div role="status"><span class="visually-hidden">Loading Velomine…</span></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
