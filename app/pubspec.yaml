name: velomine
description: "Velomine: the cycling club training app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_appauth: ^13.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_web_plugins:
    sdk: flutter
  geolocator: ^14.1.2
  go_router: ^18.1.2
  http: ^1.6.0
  intl: ^0.20.3
  riverpod_annotation: ^4.0.8
  sentry_flutter: ^10.3.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  velomine_api:
    path: packages/velomine_api
  # dart.dev's official browser interop: drag-and-drop, folder and file pickers without a plugin.
  web: ^1.1.2

dev_dependencies:
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.10
  riverpod_lint: ^3.2.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
