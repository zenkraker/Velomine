include: package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: ^3.2.0

# Both fire on legitimate structure here and are false positives: runApp in
# telemetry.dart receives a widget that main.dart already wrapped in a
# ProviderScope, and the provider override in ride_detail_test.dart is the root
# scope of a widget test rather than a nested one. Riverpod's plugin does not
# honour per-line ignores.
custom_lint:
  rules:
    - missing_provider_scope: false
    - scoped_providers_should_specify_dependencies: false

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
