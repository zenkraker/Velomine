include: package:flutter_lints/flutter.yaml

# riverpod_lint is deliberately not enabled. Under the analyzer's plugin
# mechanism it reports missing_provider_scope on the runApp calls in
# telemetry.dart (the widget is already wrapped in a ProviderScope by main.dart)
# and scoped_providers_should_specify_dependencies on a widget test's root
# scope, and it honours neither per-line ignores nor custom_lint configuration,
# so it could only be satisfied by disabling the checks in CI.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    # Written by gen-l10n. Flutter 3.50's generator still names the localisation delegates from
    # flutter_localizations, which 3.50 deprecated in favour of material_ui and cupertino_ui, and it has no
    # option to change that. Our own code is analysed; this file follows Flutter.
    - lib/l10n/generated/**
