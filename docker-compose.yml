# Runs the whole stack for local testing:  docker compose up --build
# Server: http://localhost:8080   (health: /health, API: /api/v1/server)
# Development defaults only; set real values in a .env file for anything shared.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: velomine
      POSTGRES_USER: velomine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-velomine-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velomine -d velomine"]
      interval: 5s
      timeout: 3s
      retries: 10

  velomine:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Velomine: Host=postgres;Database=velomine;Username=velomine;Password=${POSTGRES_PASSWORD:-velomine-dev}
      # First admin, created on start when the server has none. Change these for anything shared.
      Velomine__Admin__Email: ${VELOMINE_ADMIN_EMAIL:-admin@velomine.local}
      Velomine__Admin__Password: ${VELOMINE_ADMIN_PASSWORD:-Velomine-dev-1}
    ports:
      - "${VELOMINE_PORT:-8080}:8080"
    volumes:
      - velomine-files:/data/files

volumes:
  postgres-data:
  velomine-files:
