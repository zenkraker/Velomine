# Velomine: PostgreSQL, the server (the API and background work) and the web image (the web app and the presentation
# site). This is the whole stack a self-hoster runs; it holds no development or hosting extras.
#
#   From source:              docker compose up --build
#   From the published images: set VELOMINE_VERSION in .env, then  docker compose pull && docker compose up -d --wait
#
# http://localhost:8080 is the web image: it serves the web app and the site and forwards /api, /health and /openapi
# (and the single sign-on callbacks) to the server, which is not published. Settings go in a .env file next to this one
# (README, "Settings you can change"); every variable in it reaches the server.
#
# Overlays add what one use needs, with -f (or COMPOSE_FILE in .env):
#   compose.development.yaml  Dex, a local single sign-on provider for development (`just up` uses it)
#   compose.demo.yaml         Traefik in front, with Let's Encrypt certificates, for a public server

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: velomine
      POSTGRES_USER: velomine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-velomine-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velomine -d velomine"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # The API and background services (Dockerfile). The web service below reaches it as `server`.
  server:
    image: ghcr.io/zenkraker/velomine-server:${VELOMINE_VERSION:-dev}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The postgres service above, unless .env points at an existing PostgreSQL server.
      CONNECTIONSTRINGS__VELOMINE: ${CONNECTIONSTRINGS__VELOMINE:-Host=postgres;Database=velomine;Username=velomine;Password=${POSTGRES_PASSWORD:-velomine-dev}}
      # First admin, created on start when the server has none. Change these for anything shared.
      VELOMINE__ADMIN__EMAIL: ${VELOMINE__ADMIN__EMAIL:-admin@velomine.local}
      VELOMINE__ADMIN__PASSWORD: ${VELOMINE__ADMIN__PASSWORD:-Velomine-dev-1}
      # The address members open, used in password reset links and calendar feeds. Set it before exposing the server.
      VELOMINE__PUBLICURL: ${VELOMINE__PUBLICURL:-http://localhost:8080}
    volumes:
      - velomine-files:/data/files
      # The Data Protection key ring signs the cookies and links, so a restart or another instance must read the same
      # keys. Back it up with the database and the files; do not give each instance its own volume.
      - velomine-keys:/data/keys
    logging: *logging

  # The web app and the presentation site (app/Dockerfile), the one published port.
  web:
    image: ghcr.io/zenkraker/velomine-web:${VELOMINE_VERSION:-dev}
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${VELOMINE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

volumes:
  postgres-data:
  velomine-files:
  velomine-keys:
