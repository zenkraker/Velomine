#cloud-config
package_update: true
package_upgrade: false
timezone: UTC
ssh_pwauth: false
disable_root: true

users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ${ssh_public_key}

packages:
  - docker.io
  - docker-compose-v2
  - restic
  - rsync
  - ca-certificates
  - curl
  - jq

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker deploy
  - mkdir -p /srv/velomine/files /srv/velomine/keys /srv/velomine/backups /srv/velomine/baseline
  - chown -R 1654:1654 /srv/velomine/files /srv/velomine/keys
  - chown -R deploy:deploy /srv/velomine/backups /srv/velomine/baseline
  - chmod 750 /srv/velomine
  - mkdir -p /etc/velomine
  - chmod 700 /etc/velomine
  - chown deploy:deploy /etc/velomine
