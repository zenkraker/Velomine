# A public server: the stack in docker-compose.yml behind Traefik, which answers on 80 and 443, gets and renews the
# Let's Encrypt certificates and forwards to the web image. Used for the demo; a self-hoster may use it as it is.
#
# Next to docker-compose.yml and this file, the git-ignored .env sets at least:
#
#   COMPOSE_FILE=docker-compose.yml:compose.demo.yaml   so plain `docker compose` commands use both files
#   VELOMINE_VERSION=0.3.1                              the released images to run (never `latest`)
#   VELOMINE_DOMAIN=demo.velomine.eu                    the host name of the app; its DNS points at this server
#   VELOMINE_SITE_DOMAIN=velomine.eu                    optional: a second name that serves only the presentation
#                                                       site and sends every other path to VELOMINE_DOMAIN
#   VELOMINE_ACME_EMAIL=ops@example.org                 Let's Encrypt's contact for expiry notices
#   VELOMINE__PUBLICURL=https://demo.velomine.eu         the app's address, not the site's
#   POSTGRES_PASSWORD, VELOMINE__ADMIN__EMAIL, VELOMINE__ADMIN__PASSWORD
#
# Release or roll back by changing VELOMINE_VERSION, then:  docker compose pull && docker compose up -d --wait
# `--wait` fails unless the web image reports healthy, and its health check goes through nginx to the server.
#
# Traefik reads its routes from deploy/traefik/routes.yaml, not from the Docker socket, so it has no access to the
# host's Docker; keep that file next to this one. Needs Docker Compose 2.24 or newer (`!reset`).

services:
  traefik:
    image: traefik:v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
    restart: unless-stopped
    depends_on:
      - web
    command:
      - --providers.file.filename=/etc/traefik/routes.yaml
      # HTTP only redirects to HTTPS (and answers Let's Encrypt's challenge).
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --entryPoints.websecure.http3=true
      # Traefik stops reading a request after 60 s by default; a Strava archive (up to 1 GB) on a slow upload needs
      # longer. The server still enforces its own size limit.
      - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=1h
      - --certificatesResolvers.letsencrypt.acme.email=${VELOMINE_ACME_EMAIL:?set VELOMINE_ACME_EMAIL in .env}
      - --certificatesResolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=web
      # No dashboard, no API, no anonymous usage report; warnings and errors only, and no access log (it would hold
      # addresses and raw paths).
      - --api=false
      - --global.sendAnonymousUsage=false
      - --global.checkNewVersion=false
      - --log.level=WARN
    environment:
      # Read by deploy/traefik/routes.yaml. Without a site name, the app's name serves the site too.
      VELOMINE_DOMAIN: ${VELOMINE_DOMAIN:?set VELOMINE_DOMAIN in .env}
      VELOMINE_SITE_DOMAIN: ${VELOMINE_SITE_DOMAIN:-${VELOMINE_DOMAIN}}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/traefik/routes.yaml:/etc/traefik/routes.yaml:ro
      - letsencrypt:/letsencrypt
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  web:
    # Only Traefik reaches the web image, over the compose network; nothing is published on the host's 8080.
    ports: !reset []
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  letsencrypt:
