# One Velomine environment on the host: the server and the web image at one version, the same pair a self-hoster runs.
# Every environment uses this file, from its own folder on the host:
#
#   /opt/velomine/<env>/compose.yaml   this file
#   /opt/velomine/<env>/.env           the environment, the version and the host names (.env.example)
#   /opt/velomine/<env>/app.env        the server's settings and secrets (../envs/app.env.example)
#
# Release or roll back by setting VELOMINE_VERSION in .env, then:
#
#   cd /opt/velomine/<env> && docker compose pull && docker compose up -d --wait
#
# `--wait` fails if the web container does not report healthy, and its health check goes through nginx to the server, so
# healthy means both answer. The data lives under /srv/velomine/<env>.
#
# Networks: the web container joins Traefik's `proxy` network and this environment's own network; the server only this
# environment's network. So no environment, and nothing on `proxy`, can reach another environment's server.
name: velomine-${VELOMINE_ENV:?set VELOMINE_ENV in .env}

services:
  server:
    image: ghcr.io/zenkraker/velomine-server:${VELOMINE_VERSION:?set VELOMINE_VERSION in .env}
    restart: unless-stopped
    env_file: [app.env]
    volumes:
      - /srv/velomine/${VELOMINE_ENV}/files:/data/files
      - /srv/velomine/${VELOMINE_ENV}/keys:/data/keys
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${VELOMINE_SERVER_MEM_LIMIT:-600m}
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/zenkraker/velomine-web:${VELOMINE_VERSION}
    restart: unless-stopped
    depends_on: [server]
    networks: [internal, proxy]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.velomine-${VELOMINE_ENV}.rule=${VELOMINE_ROUTER_RULE:?set VELOMINE_ROUTER_RULE in .env}
      - traefik.http.routers.velomine-${VELOMINE_ENV}.entryPoints=websecure
      - traefik.http.routers.velomine-${VELOMINE_ENV}.tls.certResolver=letsencrypt
      - traefik.http.routers.velomine-${VELOMINE_ENV}.middlewares=${VELOMINE_MIDDLEWARES:-hsts@docker}
      - traefik.http.services.velomine-${VELOMINE_ENV}.loadBalancer.server.port=8080
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    name: velomine-${VELOMINE_ENV}
  proxy:
    name: proxy
    external: true
