# Traefik for the VPS that runs the demo and the dev environment: the one process on ports 80 and 443. It gets and
# renews the Let's Encrypt certificates and forwards each host name to the container that owns it. Self-hosters
# do not need it; they bring their own HTTPS. Each environment is its own compose project (see compose.hosted.yaml) and
# reaches Traefik over the external network "proxy", so releasing or restarting one never touches the other.
#
# One-time, on the host:  docker network create proxy
# A git-ignored .env next to this file sets:
#
#   VELOMINE_ACME_EMAIL=ops@example.org   Let's Encrypt's contact for expiry notices
#
# Every route comes from the labels on an environment's web container (compose.hosted.yaml), read through the Docker
# socket. The presentation site is not here: it is on GitHub Pages, at velomine.eu. Docker's socket gives whoever holds
# it control of the host, even mounted read-only, so Traefik runs with a read-only file system and no new privileges,
# publishes no dashboard or API, and routes only containers that carry traefik.enable=true.
#
# Start or update it:  docker compose -f deploy/traefik/compose.yaml up -d
# Changing this file's settings recreates only Traefik. Needs Docker Compose 2.24 or newer (`!reset`).

name: traefik

services:
  traefik:
    image: traefik:v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=proxy
      # HTTP only redirects to HTTPS (and answers Let's Encrypt's challenge).
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --entryPoints.websecure.http3=true
      # Traefik stops reading a request after 60 s by default; a Strava archive (up to 1 GB) on a slow upload needs
      # longer. The server still enforces its own size limit.
      - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=1h
      - --certificatesResolvers.letsencrypt.acme.email=${VELOMINE_ACME_EMAIL:?set VELOMINE_ACME_EMAIL in .env}
      - --certificatesResolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=web
      # No dashboard, no API, no anonymous usage report; warnings and errors only, and no access log (it would hold
      # addresses and raw paths).
      - --api=false
      - --global.sendAnonymousUsage=false
      - --global.checkNewVersion=false
      - --log.level=WARN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks: [proxy]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true

volumes:
  letsencrypt:
