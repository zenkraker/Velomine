# Traefik's routes for deploy/traefik/compose.yaml, read through its file provider. Traefik renders this file as a Go
# template first (so template braces must not appear in comments either) and fills in the host names from the
# environment compose.yaml gives it: VELOMINE_DOMAIN (the demo app), VELOMINE_SITE_DOMAIN (the presentation site) and
# VELOMINE_DEV_DOMAIN (the dev environment, no route when empty). The demo's web image is reached as demo-web and the
# dev one as dev-web: the VELOMINE_PROXY_ALIAS of each stack (compose.hosted.yaml).
#
# One name for both (VELOMINE_SITE_DOMAIN unset): one router, and the web image serves everything as it would anywhere.
# Two names: each serves only its own part and redirects the rest to the other, keeping the path:
#   site name: the site's pages (the same list as app/nginx.conf) and the two forms' posts (/api/v1/feedback and /api/v1/early-access, POSTs that a redirect would turn into a GET); anything else, such as /sign-in, goes to the app.
#   app name:  the app and the API; the site's pages go to the site, and / opens the app (/rides; it signs in first).
# robots.txt and /.well-known/ answer on both names, since crawlers and security.txt are per host.
# Redirects are temporary (302), so browsers do not remember them if prod later answers elsewhere.
http:
  routers:
    velomine-app:
      rule: Host(`{{ env "VELOMINE_DOMAIN" }}`)
      priority: 100
      entryPoints: [websecure]
      service: demo
      middlewares: [hsts]
      tls:
        certResolver: letsencrypt
{{- if ne (env "VELOMINE_SITE_DOMAIN") (env "VELOMINE_DOMAIN") }}

    velomine-site:
      rule: Host(`{{ env "VELOMINE_SITE_DOMAIN" }}`) && (Path(`/`) || PathRegexp(`^/(status|pricing|demo|contact|feedback|early-access|principles|privacy|terms|security)(/|$)`) || Path(`/api/v1/feedback`) || Path(`/api/v1/early-access`) || PathPrefix(`/static/`) || PathPrefix(`/.well-known/`) || Path(`/robots.txt`) || Path(`/sitemap.xml`))
      priority: 300
      entryPoints: [websecure]
      service: demo
      middlewares: [hsts]
      tls:
        certResolver: letsencrypt
    velomine-site-to-app:
      rule: Host(`{{ env "VELOMINE_SITE_DOMAIN" }}`)
      priority: 200
      entryPoints: [websecure]
      service: demo
      middlewares: [hsts, to-app]
      tls:
        certResolver: letsencrypt
    velomine-app-to-site:
      rule: Host(`{{ env "VELOMINE_DOMAIN" }}`) && (PathRegexp(`^/(status|pricing|demo|contact|feedback|early-access|principles|privacy|terms|security)(/|$)`) || PathPrefix(`/static/`) || Path(`/sitemap.xml`))
      priority: 300
      entryPoints: [websecure]
      service: demo
      middlewares: [hsts, to-site]
      tls:
        certResolver: letsencrypt
    velomine-app-root:
      rule: Host(`{{ env "VELOMINE_DOMAIN" }}`) && Path(`/`)
      priority: 300
      entryPoints: [websecure]
      service: demo
      middlewares: [hsts, app-root]
      tls:
        certResolver: letsencrypt
{{- end }}

{{- if env "VELOMINE_DEV_DOMAIN" }}

    velomine-dev:
      rule: Host(`{{ env "VELOMINE_DEV_DOMAIN" }}`)
      priority: 100
      entryPoints: [websecure]
      service: dev
      middlewares: [hsts]
      tls:
        certResolver: letsencrypt
{{- end }}

  middlewares:
    # HTTPS only for a year. nginx in the web image sets the other security headers.
    hsts:
      headers:
        stsSeconds: 31536000
{{- if ne (env "VELOMINE_SITE_DOMAIN") (env "VELOMINE_DOMAIN") }}
    to-app:
      redirectRegex:
        regex: '^https://[^/]+(.*)'
        replacement: 'https://{{ env "VELOMINE_DOMAIN" }}${1}'
        permanent: false
    to-site:
      redirectRegex:
        regex: '^https://[^/]+(.*)'
        replacement: 'https://{{ env "VELOMINE_SITE_DOMAIN" }}${1}'
        permanent: false
    app-root:
      redirectRegex:
        regex: '^https://[^/]+/?(\?.*)?$'
        replacement: 'https://{{ env "VELOMINE_DOMAIN" }}/rides${1}'
        permanent: false
{{- end }}

  services:
    demo:
      loadBalancer:
        servers:
          - url: http://demo-web:8080
    dev:
      loadBalancer:
        servers:
          - url: http://dev-web:8080
