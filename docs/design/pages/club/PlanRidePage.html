<!doctype html>

<html lang="en">
<head>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Plan a ride</title><style></style></head>
<body>
<main class="vm-page narrow"><div class="vm-head"><div><p class="crumb caption">Club calendar</p><h1 class="page-title">Plan a ride</h1></div></div><article class="vm-card "><div class="vm-form"><label class="vm-field"><span class="l">Title</span><span class="vm-input"><span>Saturday hills</span></span></label><div class="vm-fields2"><label class="vm-field"><span class="l">Date</span><span class="vm-input"><span>Sat 22 Nov 2026</span><span class="end"><svg class="vm-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span></span></label><label class="vm-field"><span class="l">Time</span><span class="vm-input"><span>08:30</span></span></label></div></div></article><article class="vm-card "><div class="vm-card-head"><h3 class="vm-card-title card-title">Meeting point</h3></div><div class="vm-form"><label class="vm-field"><span class="l">Meeting point name</span><span class="vm-input"><span>Piazza Duomo, by the fountain</span></span></label><div class="vm-mapbox short" role="img" aria-label="Map"><svg viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><filter id="bpm" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter></defs><path class="water" d="M640 0 L640 120 C600 140 560 110 520 70 C490 40 470 20 470 0 Z"/><path class="road" stroke-width="6" d="M0 240 C120 230 220 260 320 250 S520 210 640 230"/><path class="road" stroke-width="4" d="M150 0 C160 90 130 180 170 360"/><path class="road" stroke-width="4" d="M380 0 C360 100 420 200 400 360"/><path class="road" stroke-width="3" d="M0 90 C100 110 250 80 380 120 S560 160 640 150"/><path class="road" stroke-width="2" d="M240 360 C260 300 300 280 290 200 S250 100 270 0"/><circle class="pin" cx="320" cy="180" r="10"/></svg><span class="attr">© OpenStreetMap</span></div><button class="vm-btn button-label text small" type="button">Pick the meeting point on the map</button></div></article><article class="vm-card "><div class="vm-card-head"><h3 class="vm-card-title card-title">Details</h3></div><div class="vm-form"><label class="vm-field"><span class="l">Route (optional)</span><span class="vm-input"><span>Colline loop</span><span class="end">▾</span></span></label><div class="vm-field"><span class="l">Pace</span><div class="vm-seg" role="group"><button type="button" aria-pressed="false">Easy</button><button type="button" aria-pressed="true">Steady</button><button type="button" aria-pressed="false">Fast</button></div></div><div class="vm-rows"><div class="vm-switch"><div class="grow"><span class="body">No-drop</span><span class="d">Nobody is left behind.</span></div><span class="vm-toggle on" role="switch" aria-checked="true"></span></div></div><label class="vm-field"><span class="l">Maximum riders (optional)</span><span class="vm-input"><span>12</span></span></label><label class="vm-field"><span class="l">Notes (optional)</span><span class="vm-input area"><span>Coffee stop at km 35.</span></span></label></div></article><button class="vm-btn button-label block" type="button">Save the ride</button></main>
</body>
</html>
