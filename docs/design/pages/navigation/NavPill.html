<!doctype html>
<!-- NavPill: The phone's floating glass pill over the content. Guideline: NavPill.md -->
<html lang="en">
<head>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Nav pill</title>
<style>
  .phone { position: relative; max-width: 420px; height: 120px; margin: var(--space-lg); }
  .vm-pill { position: absolute; left: var(--space-md); right: var(--space-md); bottom: var(--space-md); }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<p class="caption vm-muted" style="margin: var(--space-lg) var(--space-lg) 0">Auto training off: four items.</p>
<div class="phone">
  <nav class="vm-pill vm-glass" aria-label="Main">
    <a href="#"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l-1-2H7M15 9l-2 7"/></svg>Rides</a>
    <a href="#" aria-current="page"><svg class="i" viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>Progress</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Goals</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14c2.8 0 5 2.2 5 5"/></svg>Club</a>
  </nav>
</div>
<p class="caption vm-muted" style="margin: 0 var(--space-lg)">With auto training on: five items.</p>
<div class="phone">
  <nav class="vm-pill vm-glass" aria-label="Main">
    <a href="#"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l-1-2H7M15 9l-2 7"/></svg>Rides</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M9 15l2 2 4-4"/></svg>Training</a>
    <a href="#" aria-current="page"><svg class="i" viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>Progress</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Goals</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14c2.8 0 5 2.2 5 5"/></svg>Club</a>
  </nav>
</div>
</body>
</html>
