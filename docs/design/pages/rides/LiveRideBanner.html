<!doctype html>
<!-- LiveRideBanner: A ride in progress, over every screen but the recorder. Guideline: LiveRideBanner.md -->
<html lang="en">
<head>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Live ride banner</title>
<style>
  .stage { position: relative; max-width: 420px; min-height: 220px; margin: var(--space-lg); background: var(--card-raised); border-radius: var(--radius-lg); }
  .banner { position: absolute; left: var(--space-md); right: var(--space-md); bottom: calc(var(--space-md) + 72px); display: flex; align-items: center; gap: var(--space-md); min-height: 48px; padding: var(--space-sm) var(--space-lg); border-radius: var(--radius-pill); }
  .banner .state { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .banner .n { font-weight: 600; }
  .vm-pill { position: absolute; left: var(--space-md); right: var(--space-md); bottom: var(--space-md); }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<p class="caption vm-muted" style="margin: var(--space-lg) var(--space-lg) 0">Recording: the record dot in `danger`, the time and the distance counting.</p>
<div class="stage">
  <button class="banner vm-glass" type="button" aria-label="Recording, 1:12:48, 31.4 km"><svg class="i" viewBox="0 0 24 24" style="fill:var(--danger);stroke:none"><circle cx="12" cy="12" r="7"/></svg><span class="state nav-label">Recording</span><span class="n nav-label">1:12:48</span><span class="n nav-label">31.4 km</span></button>
  <nav class="vm-pill vm-glass" aria-label="Main">
    <a href="#" aria-current="page"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l-1-2H7M15 9l-2 7"/></svg>Rides</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>Progress</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Goals</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14c2.8 0 5 2.2 5 5"/></svg>Club</a>
  </nav>
</div>
<p class="caption vm-muted" style="margin: 0 var(--space-lg)">Paused: the pause mark in `ink`, the word changes, the numbers stay.</p>
<div class="stage">
  <button class="banner vm-glass" type="button" aria-label="Paused, 1:24:02, 33.1 km"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg><span class="state nav-label">Paused</span><span class="n nav-label">1:24:02</span><span class="n nav-label">33.1 km</span></button>
  <nav class="vm-pill vm-glass" aria-label="Main">
    <a href="#" aria-current="page"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l-1-2H7M15 9l-2 7"/></svg>Rides</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>Progress</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Goals</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14c2.8 0 5 2.2 5 5"/></svg>Club</a>
  </nav>
</div>
</body>
</html>
