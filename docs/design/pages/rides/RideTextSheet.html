<!doctype html>
<!-- RideTextSheet: Ride -> name and describe the ride. Guideline: RideTextSheet.md -->
<html lang="en">
<head>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Name this ride</title>
<style>
  .stage { padding: var(--space-xxxl) var(--space-lg); display: flex; justify-content: center; }
  .sheet { width: 100%; max-width: 520px; border-radius: var(--radius-xl); padding: var(--space-xl); display: flex; flex-direction: column; gap: var(--space-lg); }

</style>

<body>
<div class="stage"><section class="vm-glass sheet" role="dialog" aria-label="Name this ride"><h2 class="card-title">Name this ride</h2><p class="vm-sentence body">Your own words. Coaches you share rides with can read them.</p><div class="vm-form"><label class="vm-field"><span class="l">Title</span><span class="vm-input"><span>Sunday morning ride</span></span><span class="h">Leave empty for a name made from the time and type of ride.</span></label><label class="vm-field"><span class="l">Description</span><span class="vm-input area"><span>Steady loop with the club, two climbs.</span></span></label></div><button class="vm-btn button-label block" type="button">Save</button></section></div>
