# The site image's only configuration: the presentation site (/srv/site), and nothing else. Traefik sends the two forms'
# posts (/api/v1/feedback and /api/v1/early-access) to the web image and the app's paths (/sign-in, /register,
# /openapi) to the app's host; see compose.site.yaml.
#
# Runs as the unprivileged nginx user on a read-only root: everything nginx writes goes to /tmp (a tmpfs).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # No access log: it would hold addresses and raw paths (AGENTS.md, "Security and privacy in code").
    access_log off;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        listen 8080;
        absolute_redirect off;
        root /srv/site;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

        # Pages are linked with a trailing slash; a path without one is redirected to it.
        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-cache";
        }
        location ~ ^/(status|pricing|demo|contact|feedback|early-access|principles|privacy|terms|security)$ {
            return 301 $uri/;
        }
        location ~ ^/(status|pricing|demo|contact|feedback|early-access|principles|privacy|terms|security)/ {
            try_files $uri $uri/index.html =404;
            add_header Cache-Control "no-cache";
        }
        location ^~ /static/ { }
        location ^~ /.well-known/ { }
        location = /robots.txt { }
        location = /sitemap.xml { }

        location / {
            return 404;
        }
    }
}
