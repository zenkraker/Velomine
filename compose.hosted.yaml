# A hosted environment (the demo, the dev environment): the stack in docker-compose.yml hardened, with the web image
# reachable only by the shared Traefik (deploy/traefik/compose.yaml) over the external network "proxy". Each environment
# is its own compose project with its own volumes, so it needs its own directory name or COMPOSE_PROJECT_NAME.
#
# Next to docker-compose.yml and this file, the git-ignored .env sets at least:
#
#   COMPOSE_FILE=docker-compose.yml:compose.hosted.yaml   so plain `docker compose` commands use both files
#   VELOMINE_VERSION=0.3.1                                the released images to run (never `latest`)
#   VELOMINE_PROXY_ALIAS=demo-web                         the name Traefik reaches this web image by: demo-web or
#                                                         dev-web, as in deploy/traefik/routes.yaml
#   VELOMINE__PUBLICURL=https://demo.velomine.eu          the app's address, not the site's
#   POSTGRES_PASSWORD, VELOMINE__ADMIN__EMAIL, VELOMINE__ADMIN__PASSWORD
#
# Release or roll back by changing VELOMINE_VERSION, then:  docker compose pull && docker compose up -d --wait
# `--wait` fails unless the web image reports healthy, and its health check goes through nginx to the server.

services:
  server:
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  web:
    # Only Traefik reaches the web image, over the proxy network; nothing is published on the host's 8080.
    ports: !reset []
    networks:
      default: {}
      proxy:
        aliases:
          - ${VELOMINE_PROXY_ALIAS:?set VELOMINE_PROXY_ALIAS in .env (demo-web or dev-web)}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
